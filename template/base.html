{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TiendaLibre{% endblock %}</title>

    <!-- CDN Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Estilos propios (se cargan últimos para poder pisar a Bootstrap) -->
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">

    {% block extra_head %}{% endblock %}
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Inclusión de la Navbar reutilizable -->
    {% include "_navbar.html" %}

    <!-- Contenido Dinámico -->
    <main class="container my-4 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer común -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 TiendaLibre - Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- CDN Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
