{% extends "base.html" %}

{% block title %}
Productos - TiendaLibre
{% endblock %}

{% block content %}

<h1 class="mb-4">Nuestros productos</h1>

{% for producto in productos %}

<div class="card mb-3">
    <div class="card-body">

        <h5 class="card-title">
            {{ producto }}
        </h5>

    </div>
</div>

{% empty %}

<div class="alert alert-info">
    No hay productos disponibles.
</div>

{% endfor %}

{% endblock %}
